<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=800, initial-scale=1">
<title>CMU Tweaks</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="app">
  <div id="header"><div id="wordmark">CMU <span>TWEAKS</span></div><div id="subtitle">PERSONALIZE YOUR DRIVE</div><div id="system-info" role="status">CPU: -- | Free space: reading...</div><button id="refresh" class="small">Refresh</button><button id="exit" class="small">Exit</button></div>
  <div id="tabs" role="tablist"></div>
  <div id="content"><div id="cards"></div><div id="empty">Reading tweaks from USB...</div></div>
  <div id="footer"><span id="footer-status">Connecting to shell bridge...</span><span id="legend"><i class="dot installed"></i> Installed <i class="dot uninstalled"></i> Not installed <i class="dot error"></i> Error</span></div>
</div>
<div id="overlay" class="hidden">
  <div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div id="dialog-heading"><i id="dialog-dot" class="dot"></i><span id="dialog-title"></span></div>
    <div id="dialog-body"><div id="dialog-state"></div><div id="dialog-description"></div><div id="dialog-meta"></div><pre id="dialog-output"></pre></div>
    <div id="dialog-actions"><button id="back">Back</button><button id="action" class="primary">Install</button><button id="result-ok" class="primary hidden">OK</button></div>
  </div>
</div>
<iframe id="transport" title="Shell transport"></iframe>
<script>window.installerConfig = {origin:"@ORIGIN@",token:"@TOKEN@"};</script>
<script src="app.js"></script>
</body></html>
