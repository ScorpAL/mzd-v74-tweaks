name: Validate tweaks
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.23.0
      - name: Validate manifests, checksums, shell syntax and registered coverage
        run: python tools/validate.py
      - name: Check shell errors
        run: shellcheck --severity=error --shell=sh autorun.sh installer.sh lib/*.sh tweaks/*/run.sh examples/hello/run.sh
      - name: Run actual workers in a read-only, networkless BusyBox container
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,exec,nosuid,size=128m \
            -e PYTHONDONTWRITEBYTECODE=1 -e CMU_TEST_BUSYBOX=1 \
            -v "$PWD:/repo:ro" -w /repo python:3.12-alpine \
            python tests/contract/test_workers.py
      - name: Exercise the real SSH supervisor with fake system commands
        run: python tests/contract/test_ssh_service.py
      - name: Test Hello entrypoint
        run: python tests/contract/test_hello.py
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/installer/test-ui.cjs
      - run: node tests/installer/test-transport.cjs
